name: Prueba Runner y Secrets

on: [push]

jobs:
  validar-tokens:
    runs-on: self-hosted
    steps:
      - name: Comparar secret con variable local
        shell: powershell
        env:
          SECRET_DEV: ${{ secrets.DEV_TOKEN }}
        run: |
          $localDev = [System.Environment]::GetEnvironmentVariable("LOCAL_DEV_TOKEN", "Machine")
          if (-not $localDev) {
            $localDev = $env:LOCAL_DEV_TOKEN
          }
          
          Write-Output "Comprobando credenciales..."
          if ($env:SECRET_DEV -eq $localDev) {
            Write-Output "OK: DEV_TOKEN coincide con LOCAL_DEV_TOKEN"
            exit 0
          } else {
            Write-Error "ERROR: DEV_TOKEN NO coincide con LOCAL_DEV_TOKEN"
            exit 1
          }
